<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Page Not Found</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }
    .container {
        max-width: 500px;
    }
    h1 {
        font-size: 80px;
        margin: 0;
        color: #d9534f;
    }
    p {
        font-size: 20px;
        margin: 10px 0 20px;
        color: #555;
    }
    a {
        padding: 10px 20px;
        background: #0275d8;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
    a:hover {
        background: #025aa5;
    }
</style>
</head>
<body>
<div class="container">
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="/">Go Back Home</a>
</div>
</body>
</html>
