<body> 


<div class="container-fluid bg-white p-0 m-0">

    <div class="system-background vh-100 overflow-auto justify-content-md-start">
        <div class="col-12 col-md-5 col-lg-4 col-xl-3 bg-white h-100 shadow-sm overflow-auto row m-0 align-items-center">
            
            <div class="p-4">
                <div class="text-center mb-4">
                    <img src="https://payment.marikina.gov.ph/Marikina/OS/public/build/assets/seal-bwXbQ9Nk.png" alt="logo" class="p-1" height="120" width="120">
                    
                    <img src="https://payment.marikina.gov.ph/Marikina/OS/public/build/assets/system-seal-D6A-cpTs.png" alt="logo" class="p-1">
                </div>
                <div class="px-2">
                    <label class="fs-4 fw-bold mb-3">SIGN IN</label>

                    <div id="outMessage">
                                                                    </div>
                    
                    <form id="sign-in-form" autocomplete="off">
                        <div class="input-group transition-border mb-3">
                            <span class="input-group-text bg-transparent border-top-0 border-start-0 border-end-0 rounded-0">
                                <i class="fa-solid fa-user fs-5"></i>
                            </span>
                            <input  type="text" class="form-control bg-transparent border-top-0 border-start-0 border-end-0 rounded-0 shadow-none"  
                                    name="email"                     
                                    id="email" 
                                    placeholder="Email address" 
                                    value=""
                                    readonly
                                    autocomplete="off">
                        </div>

                        <div class="input-group transition-border mb-3 position-relative">
                            <span class="input-group-text bg-transparent border-top-0 border-start-0 border-end-0 rounded-0">
                                <i class="fa-solid fa-lock fs-5"></i>
                            </span>
                            <input  type="password" class="form-control bg-transparent border-top-0 border-start-0 border-end-0 rounded-0 shadow-none z-1"  
                                    name="password" 
                                    id="password" 
                                    placeholder="Password" 
                                    value=""
                                    readonly
                                    autocomplete="off">
                            
                            <span class="position-absolute end-0 bottom-0 mb-2 me-2 z-2">
                                <i role="button" class="fa fa-eye-slash toggle-password" data-target="#password"></i>
                            </span>
                        </div>

                        <div id="captcha-sign-in-content" class="my-2 d-flex justify-content-sm-center justify-content-start">
                            <div data-sitekey="6Lf1hJMgAAAAAM4XTdkGupDOWG4Su33tXQLyufvk" class="g-recaptcha"></div>
                        </div>
                    </form>
                    
                    <div class="mb-2">
                        <a class="text-decoration-none small" role="button" id="forgot-password">Forgot Password?</a>
                    </div>

                    <div class="d-grid gap-2 mb-2">
                        <button class="btn btn-primary py-2" type="button" id="sign-in">
                            <i class="fa-regular fa-hand-pointer"></i>&nbsp; SIGN IN
                        </button>
                    </div>

                    <div class="text-center text-md-start mb-2">
                        <a class="text-decoration-none small" href="https://payment.marikina.gov.ph/Marikina/OS/signup">
                            Don't have an account? <span class="fw-bold">Sign up.</span>
                        </a>
                    </div>

                    <div class="text-center text-md-start mb-4">
                        <a class="text-decoration-none small" href="https://docs.google.com/document/d/1l2smLisLjPIf8iaSl5FCGSQmThIHPbP9Zu7E_KSce2U/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
                            Not sure how to get started? <span class="d-block fw-bold fs-6 mt-1">See our guides and video tutorials.</span>
                        </a>
                    </div>

                    <div class="small mt-3 border-top pt-3">
                        <p class="mb-0">&copy; 2026 City of Marikina, Metro Manila.</p>
                        <p class="mb-0">All rights reserved.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<button class="d-none btn btn-primary position-fixed bottom-0 end-0 border-end-0 rounded-end-0 mb-3 ps-2 pe-1 shadow-sm  bg-opacity-10 border-2" 
        id="btn-page-up">
        <i class="fa-solid fa-angle-up"></i>
    </button>
